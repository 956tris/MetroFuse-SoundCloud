name: Build and release SoundCloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test and package
        run: python3 tooling/build.py --test

      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: soundcloud-package
          path: |
            dist/soundcloud.mfp
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json, re; v=json.load(open("plugin/manifest.json", encoding="utf-8"))["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v); print(v)')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SoundCloud $version" --latest \
            --notes "Import soundcloud.mfp in MetroFuse 10.0.0 Stable on Android or desktop. Requires Plugin API 1.2.0. See the repository README for sign-in and playback setup." \
            dist/soundcloud.mfp dist/SHA256SUMS
